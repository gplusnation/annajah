    <style>
        :root {
            --primary: #0f766e; /* Hijau Emerald */
            --primary-light: #14b8a6;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-sub: #6b7280;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: var(--text-main);
        }

        /* Container Utama */
        .app-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            width: 100%;
            max-width: 900px;
        }

        /* Layout Desktop: Player di kiri (sticky), Playlist di kanan */
        @media (min-width: 768px) {
            .app-container {
                flex-direction: row;
                align-items: flex-start;
            }
            .player-card {
                width: 380px;
                flex-shrink: 0;
                position: sticky;
                top: 20px;
            }
            .playlist-card {
                flex: 1;
            }
        }

        /* Player Card Container */
        .player-card {
            background: var(--card-bg);
            width: 100%;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        /* Cover Art / Header */
        .cover-art {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .cover-art i { font-size: 48px; margin-bottom: 10px; opacity: 0.9; }
        .cover-art h1 { font-size: 20px; margin: 0; font-weight: 600; text-align: center; }
        .cover-art p { font-size: 14px; margin: 5px 0 0; opacity: 0.8; }

        /* Info Section */
        .track-info {
            padding: 24px;
            text-align: center;
            min-height: 80px; /* Mencegah layout shift saat ganti lagu */
        }

        .track-info h2 {
            font-size: 18px;
            margin: 0 0 8px;
            color: var(--text-main);
            font-weight: 700;
        }

        .track-info span {
            font-size: 13px;
            color: var(--text-sub);
            white-space: pre-line; /* Agar \n di JSON menjadi baris baru */
            line-height: 1.5;
            display: block;
        }

        /* Progress Bar */
        .progress-container {
            padding: 0 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .time { font-size: 12px; color: var(--text-sub); min-width: 35px; }

        .progress-bar {
            flex: 1;
            height: 6px;
            -webkit-appearance: none;
            background: #e5e7eb;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: var(--primary);
            border-radius: 50%;
            cursor: pointer;
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            gap: 24px;
        }

        .btn-control {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-control:hover { color: var(--primary); transform: scale(1.1); }

        .btn-play {
            background: var(--primary);
            color: white;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            box-shadow: 0 4px 10px rgba(15, 118, 110, 0.3);
        }

        .btn-play:hover { background: var(--primary-light); transform: scale(1.05); }

        .footer {
            text-align: center;
            padding: 16px;
            background: #f9fafb;
            font-size: 11px;
            color: var(--text-sub);
            border-top: 1px solid #f3f4f6;
        }

        /* ==================== PLAYLIST CARD ==================== */
        .playlist-card {
            background: var(--card-bg);
            width: 100%;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .playlist-header {
            padding: 20px 24px;
            border-bottom: 1px solid #f3f4f6;
        }

        .playlist-header h3 {
            margin: 0;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .playlist-list {
            max-height: 500px;
            overflow-y: auto;
            padding: 10px 0;
        }

        .playlist-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            cursor: pointer;
            transition: background 0.2s;
            border-left: 4px solid transparent;
        }

        .playlist-item:hover { background: #f9fafb; }

        .playlist-item.active {
            background: #ecfdf5;
            border-left-color: var(--primary);
        }

        .playlist-item.active .item-title { color: var(--primary); font-weight: 600; }
        .playlist-item.active i { color: var(--primary); }

        .item-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            margin-right: 15px;
            overflow: hidden;
        }

        .item-title { font-size: 14px; font-weight: 500; }
        
        .item-subtitle {
            font-size: 12px;
            color: var(--text-sub);
            white-space: pre-line;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .playlist-item i { font-size: 18px; color: var(--text-sub); }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 16px;
            border-top: 1px solid #f3f4f6;
        }

        .pagination button {
            background: none;
            border: 1px solid #e5e7eb;
            color: var(--text-sub);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            transition: all 0.2s;
        }

        .pagination button:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
        .pagination button.active { background: var(--primary); color: white; border-color: var(--primary); }
        .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Custom Scrollbar */
        .playlist-list::-webkit-scrollbar { width: 6px; }
        .playlist-list::-webkit-scrollbar-track { background: #f1f1f1; }
        .playlist-list::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
    </style>
</head>

            { "title": "Audio ke-147", "subtitle": "Bab beriman terhadap hari akhir, seorang hamba akan dibangkitkan ketika yaumul ba'tsi sesuai dengan bagaimana keadaannya meninggal", "url": "https://github.com/gplusnation/annajah/raw/refs/heads/main/147.m4a" },
            { "title": "Audio ke-148", "subtitle": "Bab beriman terhadap hari akhir, kelompok-kelompok yang mengingkari yaumul ba'tsi", "url": "https://github.com/gplusnation/annajah/raw/refs/heads/main/148.m4a" },
            { "title": "Audio ke-149", "subtitle": "Bab beriman terhadap hari akhir, bantahan terhadap kelompok yang mengingkari yaumul ba'tsi", "url": "https://github.com/gplusnation/annajah/raw/refs/heads/main/149.m4a" },
            { "title": "Audio ke-150", "subtitle": "Bab beriman terhadap hari akhir, bantahan kepada kelompok yang menetapkan adanya ar-roj'ah sebelum hari kiamat", "url": "https://github.com/gplusnation/annajah/raw/refs/heads/main/150.m4a" },
            { "title": "Audio ke-151", "subtitle": "Bab beriman terhadap hari akhir, definisi dan dalil yang menetapkan Al-Hasr", "url": "https://github.com/gplusnation/annajah/raw/refs/heads/main/151.m4a" },
            { "title": "Audio ke-152", "subtitle": "Bab beriman terhadap hari akhir, hewan-hewan juga akan dikumpulkan ketika peristiwa yaumul hasyr", "url": "https://github.com/gplusnation/annajah/raw/refs/heads/main/152.m4a" },
            { "title": "Audio ke-153", "subtitle": "Bab beriman terhadap hari akhir, Allah Ta'ala mengganti bumi dan langit pada hari kiamat", "url": "https://github.com/gplusnation/annajah/raw/refs/heads/main/153.m4a" },
            { "title": "Audio ke-154", "subtitle": "Bab beriman terhadap hari akhir, sifat perubahan langit dan bumi ketika yaumul hasyr", "url": "https://github.com/gplusnation/annajah/raw/refs/heads/main/154.m4a" },
            { "title": "Audio ke-155", "subtitle": "Bab beriman terhadap hari akhir, sifat dan keadaan manusia ketika dikumpulkan pada yaumul hasyr", "url": "https://github.com/gplusnation/annajah/raw/refs/heads/main/155.m4a" },
            { "title": "Audio ke-156", "subtitle": "Bab beriman terhadap hari akhir, keadaan orang yang sombong ketika terjadinya yaumul hasyr", "url": "https://github.com/gplusnation/annajah/raw/refs/heads/main/156.m4a" },
            { "title": "Audio ke-157", "subtitle": "Bab beriman terhadap hari akhir, keadaan orang yang sering meminta-minta dan ummat nabi Muhammad shallallahu alaihi wassalam ketika yaumul hasyr", "url": "https://github.com/gplusnation/annajah/raw/refs/heads/main/157.m4a" },
            { "title": "Audio ke-158", "subtitle": "Bab beriman terhadap hari akhir, keadaan seorang mujahid di jalan Allah ketika dikumpulkan di padang mahsyar", "url": "https://github.com/gplusnation/annajah/raw/refs/heads/main/158.m4a" },
            { "title": "Audio ke-159", "subtitle": "Bab beriman terhadap hari akhir, yang pertama sekali akan memakai pakaian dari kalangan makhluk Allah setelah peristiwa yaumul hasyr", "url": "https://github.com/gplusnation/annajah/raw/refs/heads/main/159.m4a" },
            { "title": "Audio ke-160", "subtitle": "Bab beriman terhadap hari akhir, makna hadits yang menyebutkan manusia akan dibangkitkan dengan pakaian yang dengannya ia meninggal", "url": "https://github.com/gplusnation/annajah/raw/refs/heads/main/160.m4a" },
            { "title": "Audio ke-161", "subtitle": "Bab beriman terhadap hari akhir, peristiwa datangnya Allah Ta'ala untuk mengadili seluruh amalan-amalan manusia", "url": "https://github.com/gplusnation/annajah/raw/refs/heads/main/161.m4a" },
            { "title": "Audio ke-162", "subtitle": "Bab beriman terhadap hari akhir, dalil dari As-Sunnah dan ijma' yang menetapkan peristiwa datangnya Allah Ta'ala di padang mahsyar", "url": "https://github.com/gplusnation/annajah/raw/refs/heads/main/162.m4a" },
            { "title": "Audio ke-163", "subtitle": "Bab beriman terhadap hari akhir, perbedaan antara mu'min dan kafir ketika melihat Allah Ta'ala di padang mahsyar", "url": "https://github.com/gplusnation/annajah/raw/refs/heads/main/163.m4a" }
        ];

        // ==================== LOGIKA & FUNGSI ====================
        
        // 1. Sorting yang lebih aman menggunakan Regex (Mengambil angka pertama yang ditemukan)
        audioFiles.sort((a, b) => {
            const getNum = (str) => {
                const match = str.match(/\d+/);
                return match ? parseInt(match[0]) : 0;
            };
            return getNum(a.title) - getNum(b.title);
        });

        const audioPlayer = document.getElementById("audio-player");
        const playlistContainer = document.getElementById("playlist-container");
        const currentTitle = document.getElementById("current-title");
        const currentSubtitle = document.getElementById("current-subtitle");
        const prevBtn = document.getElementById("prev-btn");
        const nextBtn = document.getElementById("next-btn");
        const pageNumbers = document.getElementById("page-numbers");
        const playBtn = document.getElementById("playBtn");
        const playIcon = document.getElementById("playIcon");
        const progressBar = document.getElementById("progressBar");
        const currentTimeEl = document.getElementById("currentTime");
        const durationEl = document.getElementById("duration");

        let currentTrackIndex = 0;
        let currentPage = 1;
        const itemsPerPage = 10;

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        function loadTrack(index) {
            if (index < 0 || index >= audioFiles.length) return;
            currentTrackIndex = index;
            const track = audioFiles[currentTrackIndex];
            
            audioPlayer.src = track.url;
            currentTitle.textContent = track.title;
            currentSubtitle.textContent = track.subtitle || "Kajian An-Najah";
            
            progressBar.value = 0;
            currentTimeEl.textContent = "0:00";
            durationEl.textContent = "0:00";
            
            updateActivePlaylistItem();
        }

        function updateActivePlaylistItem() {
            document.querySelectorAll('.playlist-item').forEach(item => {
                item.classList.remove('active');
                if (parseInt(item.dataset.index) === currentTrackIndex) {
                    item.classList.add('active');
                    // Scroll otomatis ke item yang sedang diputar jika berada di halaman yang sama
                    item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            });
        }

        function playAudio() {
            audioPlayer.play();
            playIcon.classList.remove('fa-play');
            playIcon.classList.add('fa-pause');
        }

        function pauseAudio() {
            audioPlayer.pause();
            playIcon.classList.remove('fa-pause');
            playIcon.classList.add('fa-play');
        }

        function nextTrack() {
            if (currentTrackIndex < audioFiles.length - 1) {
                loadTrack(currentTrackIndex + 1);
                playAudio();
            }
        }

        function prevTrack() {
            if (currentTrackIndex > 0) {
                loadTrack(currentTrackIndex - 1);
                playAudio();
            }
        }

        function renderPlaylist() {
            playlistContainer.innerHTML = '';
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageItems = audioFiles.slice(start, end);

            pageItems.forEach((track, index) => {
                const globalIndex = start + index;
                const item = document.createElement('div');
                item.className = 'playlist-item';
                item.dataset.index = globalIndex;
                if (globalIndex === currentTrackIndex) item.classList.add('active');
                
                item.innerHTML = `
                    <div class="item-info">
                        <span class="item-title">${track.title}</span>
                        <span class="item-subtitle">${track.subtitle || ''}</span>
                    </div>
                    <i class="fas fa-play-circle"></i>
                `;
                
                item.addEventListener('click', () => {
                    loadTrack(globalIndex);
                    playAudio();
                });
                
                playlistContainer.appendChild(item);
            });
            
            renderPagination();
        }

        function renderPagination() {
            pageNumbers.innerHTML = '';
            const totalPages = Math.ceil(audioFiles.length / itemsPerPage);
            
            const prevPageBtn = document.createElement('button');
            prevPageBtn.innerHTML = '<i class="fas fa-chevron-left"></i>';
            prevPageBtn.disabled = currentPage === 1;
            prevPageBtn.addEventListener('click', () => {
                if (currentPage > 1) { currentPage--; renderPlaylist(); }
            });
            pageNumbers.appendChild(prevPageBtn);

            let startPage = Math.max(1, currentPage - 2);
            let endPage = Math.min(totalPages, startPage + 4);
            if (endPage - startPage < 4) startPage = Math.max(1, endPage - 4);

            for (let i = startPage; i <= endPage; i++) {
                const pageBtn = document.createElement('button');
                pageBtn.textContent = i;
                if (i === currentPage) pageBtn.classList.add('active');
                pageBtn.addEventListener('click', () => {
                    currentPage = i;
                    renderPlaylist();
                });
                pageNumbers.appendChild(pageBtn);
            }

            const nextPageBtn = document.createElement('button');
            nextPageBtn.innerHTML = '<i class="fas fa-chevron-right"></i>';
            nextPageBtn.disabled = currentPage === totalPages;
            nextPageBtn.addEventListener('click', () => {
                if (currentPage < totalPages) { currentPage++; renderPlaylist(); }
            });
            pageNumbers.appendChild(nextPageBtn);
        }

        // ==================== EVENT LISTENERS ====================
        playBtn.addEventListener('click', () => {
            if (audioPlayer.paused) {
                if (!audioPlayer.src) loadTrack(0); 
                playAudio();
            } else {
                pauseAudio();
            }
        });

        prevBtn.addEventListener('click', prevTrack);
        nextBtn.addEventListener('click', nextTrack);

        audioPlayer.addEventListener('timeupdate', () => {
            if (audioPlayer.duration) {
                const progress = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                progressBar.value = progress;
                currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
            }
        });

        audioPlayer.addEventListener('loadedmetadata', () => {
            durationEl.textContent = formatTime(audioPlayer.duration);
        });

        // Auto-play next track saat audio selesai
        audioPlayer.addEventListener('ended', nextTrack);

        progressBar.addEventListener('input', () => {
            if (audioPlayer.duration) {
                const seekTime = (progressBar.value / 100) * audioPlayer.duration;
                audioPlayer.currentTime = seekTime;
            }
        });

        // ==================== INISIALISASI ====================
        loadTrack(0);
        renderPlaylist();

    </script>
</body>
